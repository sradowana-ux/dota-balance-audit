name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      # Fails the build if README.md reports numbers that disagree with
      # artifacts/report.json -- the README's results table is generated, so a
      # mismatch means someone edited the claims by hand.
      - name: Check README matches evaluation artifacts
        run: python eval/render_results.py --check
