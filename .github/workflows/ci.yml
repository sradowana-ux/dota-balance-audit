name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      # The README findings and the model results are both generated from
      # artifacts/. If either has been edited by hand, or the artifacts have
      # been regenerated without re-rendering, the build fails rather than
      # letting the write-up quietly overstate what the code produced.
      - name: Check README matches the analysis artifacts
        run: python analysis/render_report.py --check

      - name: Check model doc matches the evaluation artifacts
        run: python eval/render_results.py --check
